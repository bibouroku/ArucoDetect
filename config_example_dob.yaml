# DOB 抗风补偿参数配置文件
# 路径: ros2_ws/src/tracktor-beam/config/drone_tracker_params.yaml
# 
# 用法:
# ros2 launch tracktor_beam drone_tracker.launch.py config_file:=config/drone_tracker_params.yaml

drone_tracker_controller:
  ros__parameters:
    # ===== 无人机物理参数 =====
    drone:
      mass: 2.0                  # 无人机质量 (kg)，需根据实际调整
      hover_thrust_norm: 0.5     # 悬停时的标准化推力 (0-1)
    
    # ===== PD 控制器参数 =====
    control:
      kp: 1.0                    # 位置增益 (1.0-2.0)
                                 # 过小：跟踪响应慢
                                 # 过大：易震荡
      kd: 2.0                    # 速度增益/阻尼 (1.0-3.0)
                                 # 用于稳定性，越大越阻尼
    
    # ===== 卡尔曼滤波参数 =====
    kf:
      q_std: 0.3                 # 过程噪声标准差 (0.1-0.5)
                                 # 过小：跟踪延迟
                                 # 过大：噪声放大
      r_std: 0.01                # 测量噪声标准差 (0.001-0.05)
                                 # 依赖相机测量精度
      dt: 0.03                   # 名义时间步长 (秒) = 30ms
    
    # ===== 跟踪参数 =====
    tracking:
      prediction_horizon: 0.65   # 前向预测时间 (秒)
                                 # 补偿测量和控制延迟
    
    # ===== DOB 观测器参数 =====
    # 注意：以下参数在代码中硬编码，如需修改需改源代码或添加参数订阅
    dob:
      mass: 2.0                  # 同上 drone.mass（代码中已使用 declare_parameter）
      K: 2.0                     # DOB 增益 (1.0-5.0)
                                 # 值越大反应越快，但可能震荡
                                 # 推荐: 2.0-3.0
      dt: 0.03                   # DOB 更新周期 (秒)，与控制周期同步

# ===== 参数调优指南 =====
#
# 场景 1: 跟踪误差大
#   - 增大 kp (1.0 → 1.5)
#   - 增大 DOB K 值 (2.0 → 3.0)
#   - 检查 prediction_horizon 是否合理
#
# 场景 2: 响应震荡
#   - 增大 kd (2.0 → 2.5)
#   - 减小 kp (1.0 → 0.8)
#   - 减小 K 值 (2.0 → 1.5)
#
# 场景 3: 对风敏感
#   - 增大 DOB K 值 (2.0 → 4.0)
#   - 增大 kd 以增加阻尼
#   - 检查推力反馈是否正确
#
# 场景 4: 卡尔曼滤波输出噪声多
#   - 减小 q_std (0.3 → 0.2)
#   - 或增大 r_std (0.01 → 0.02) 如果测量不准
#   - 增大 prediction_horizon 以平滑输出

# ===== 实际参数示例 =====
#
# 示例 1: 晴天无风（相机精度好）
# q_std: 0.2
# r_std: 0.01
# kp: 1.2
# kd: 2.0
# K: 2.5
#
# 示例 2: 阴天/有风（需更强补偿）
# q_std: 0.3
# r_std: 0.02
# kp: 1.0
# kd: 2.5
# K: 3.5
#
# 示例 3: 室内环境（小范围、多反射）
# q_std: 0.4
# r_std: 0.05
# kp: 0.8
# kd: 1.5
# K: 1.5
